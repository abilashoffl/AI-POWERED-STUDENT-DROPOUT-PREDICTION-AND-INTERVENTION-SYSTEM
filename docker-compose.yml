version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: student_dropout_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  ml-service:
    build: ./ml-service
    container_name: student_dropout_ml_service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    restart: always

  backend:
    build: ./backend
    container_name: student_dropout_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/student_dropout_db
      - JWT_SECRET=supersecret_student_dropout_prediction_key_2026
      - ML_SERVICE_URL=http://ml-service:8000
      - NODE_ENV=production
    depends_on:
      - mongodb
      - ml-service
    restart: always

  frontend:
    build: ./frontend
    container_name: student_dropout_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always

volumes:
  mongo_data:
